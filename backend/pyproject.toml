[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ontoworkbench"]

[project]
name = "ontology-workbench"
version = "0.3.1"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "anthropic>=0.40",
    "clickhouse-connect>=0.8",
    "clickhouse-sqlalchemy>=0.3.2",
    "cryptography>=43",
    "argon2-cffi>=25.1.0",
    "duckdb>=1.1",
    "duckdb-engine>=0.13",
    "fastapi>=0.115.0",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "mcp==2.2.0",
    "openai>=1.50",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "psycopg[binary]>=3.2",
    "py-horned-owl>=1.4.1",
    "pymysql>=1.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10",
    "pyoxigraph==0.5.11",
    "pyrudof==0.3.25",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "typer>=0.27.1",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
  "pytest>=8", "pytest-cov", "ruff>=0.6", "mypy>=1.11",
  "import-linter>=2", "pre-commit",
]

# DB drivers (psycopg/pymysql) and LLM SDKs (openai/anthropic) ship as core
# dependencies: the connections page and AI features work out of the box.
# `installed` in core/db_engines stays as the gray-out switch for future
# engines whose driver cannot ship in a wheel (e.g. anything needing system
# ODBC libraries).

[project.scripts]
ow = "ontoworkbench.cli:app"

[tool.pytest.ini_options]
filterwarnings = [
  # starlette's testclient emits an internal deprecation about httpx vs httpx2
  # (StarletteDeprecationWarning subclasses UserWarning); not actionable from
  # our code — filtered to keep test output pristine
  "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
  # clickhouse-sqlalchemy (native) already owns the clickhouse:// dialect
  # name when clickhouse-connect registers its own — harmless at import
  # (prefix match: the full message contains ':' which breaks filter parsing)
  "ignore:The 'clickhouse:UserWarning",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "D", "UP", "B"]
[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection idiom: Depends(...) in argument defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
[[tool.mypy.overrides]]
module = "ontoworkbench.core.*"
disallow_untyped_defs = true
[[tool.mypy.overrides]]
module = "ontoworkbench.db.*"
disallow_untyped_defs = true

[tool.importlinter]
root_package = "ontoworkbench"

[[tool.importlinter.contracts]]
name = "layering"
type = "layers"
layers = [
  "ontoworkbench.server",
  "ontoworkbench.exporter",
  "ontoworkbench.core",
]

[[tool.importlinter.contracts]]
name = "core-purity"
type = "forbidden"
source_modules = ["ontoworkbench.core"]
forbidden_modules = ["ontoworkbench.server", "ontoworkbench.db", "ontoworkbench.auth", "ontoworkbench.exporter"]

# Spec §11.4: core / db / auth must not import any upper layer.
[[tool.importlinter.contracts]]
name = "lower-purity"
type = "forbidden"
source_modules = ["ontoworkbench.core", "ontoworkbench.db", "ontoworkbench.auth"]
forbidden_modules = ["ontoworkbench.server", "ontoworkbench.exporter", "ontoworkbench.observability"]
