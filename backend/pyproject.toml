[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ontoworkbench"]

[project]
name = "ontology-workbench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.115.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10",
    "python-multipart>=0.0.32",
    "rdflib>=7.6.0",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
  "pytest>=8", "pytest-cov", "httpx", "ruff>=0.6", "mypy>=1.11",
  "import-linter>=2", "pre-commit",
]

[project.scripts]
ow = "ontoworkbench.cli:app"

[tool.pytest.ini_options]
filterwarnings = [
  # starlette's testclient emits an internal deprecation about httpx vs httpx2
  # (StarletteDeprecationWarning subclasses UserWarning); not actionable from
  # our code — filtered to keep test output pristine
  "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "D", "UP", "B"]
[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection idiom: Depends(...) in argument defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
[[tool.mypy.overrides]]
module = "ontoworkbench.core.*"
disallow_untyped_defs = true
[[tool.mypy.overrides]]
module = "ontoworkbench.db.*"
disallow_untyped_defs = true

[tool.importlinter]
root_package = "ontoworkbench"

[[tool.importlinter.contracts]]
name = "layering"
type = "layers"
layers = [
  "ontoworkbench.server",
  "ontoworkbench.exporter",
  "ontoworkbench.core",
]

[[tool.importlinter.contracts]]
name = "core-purity"
type = "forbidden"
source_modules = ["ontoworkbench.core"]
forbidden_modules = ["ontoworkbench.server", "ontoworkbench.db", "ontoworkbench.auth", "ontoworkbench.exporter"]
